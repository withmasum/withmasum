<svg width="1600" height="480" viewBox="0 0 1600 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Masum Ahmed — Full-Stack Developer</title>
  <desc id="desc">A dark graphite editorial profile banner with silver and soft-gold accents.</desc>
  <defs>
    <linearGradient id="surface" x1="80" y1="40" x2="1510" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08090B"/>
      <stop offset="0.52" stop-color="#15171C"/>
      <stop offset="1" stop-color="#090A0D"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="0" cy="0" r="1" gradientTransform="translate(1320 80) rotate(125) scale(520 480)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D58D" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#D9A441" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="1010" y1="112" x2="1480" y2="374" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.15"/>
      <stop offset="1" stop-color="white" stop-opacity="0.035"/>
    </linearGradient>
    <linearGradient id="edge" x1="1018" y1="104" x2="1490" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAE7B7" stop-opacity="0.72"/>
      <stop offset="0.45" stop-color="white" stop-opacity="0.26"/>
      <stop offset="1" stop-color="white" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="blur" x="858" y="-90" width="760" height="660" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="64"/>
    </filter>
    <filter id="shadow" x="934" y="62" width="640" height="380" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="1568" height="448" rx="38" fill="url(#surface)"/>
  <rect x="16" y="16" width="1568" height="448" rx="38" fill="url(#goldGlow)"/>
  <rect x="16.75" y="16.75" width="1566.5" height="446.5" rx="37.25" stroke="white" stroke-opacity="0.12" stroke-width="1.5"/>

  <circle cx="1325" cy="154" r="218" fill="#F6D286" fill-opacity="0.14" filter="url(#blur)"/>
  <circle cx="1120" cy="435" r="170" fill="#AEB4C0" fill-opacity="0.08" filter="url(#blur)"/>

  <g filter="url(#shadow)">
    <rect x="986" y="98" width="478" height="282" rx="28" fill="url(#glass)"/>
    <rect x="986.75" y="98.75" width="476.5" height="280.5" rx="27.25" stroke="url(#edge)" stroke-width="1.5"/>
    <path d="M1014 176H1436" stroke="white" stroke-opacity="0.13"/>
    <path d="M1014 265H1436" stroke="white" stroke-opacity="0.13"/>
    <path d="M1142 121V356" stroke="white" stroke-opacity="0.1"/>
    <path d="M1284 121V356" stroke="white" stroke-opacity="0.1"/>
    <rect x="1020" y="124" width="92" height="24" rx="12" fill="#FAE7B7" fill-opacity="0.16"/>
    <circle cx="1050" cy="220" r="32" fill="#FAE7B7" fill-opacity="0.23"/>
    <circle cx="1192" cy="220" r="32" fill="white" fill-opacity="0.11"/>
    <circle cx="1334" cy="220" r="32" fill="#FAE7B7" fill-opacity="0.12"/>
    <path d="M1020 318C1073 281 1112 351 1163 315C1214 279 1254 353 1306 315C1358 277 1395 340 1438 304" stroke="#FBE6B1" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round"/>
    <path d="M1020 336C1070 309 1112 350 1163 331C1214 312 1254 352 1306 332C1358 312 1394 339 1438 325" stroke="white" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g fill="#FFFDF8">
    <text x="112" y="130" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="4">MASUM AHMED / 01</text>
    <text x="108" y="215" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" letter-spacing="-3">Digital work,</text>
    <text x="108" y="288" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" letter-spacing="-3">made deliberate.</text>
    <text x="112" y="343" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#D4D7DE">Full-Stack Developer · Interfaces · Performance</text>
  </g>

  <g>
    <rect x="111" y="378" width="282" height="40" rx="20" fill="#F8D58D" fill-opacity="0.13"/>
    <circle cx="137" cy="398" r="5" fill="#F7D588"/>
    <text x="154" y="404" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FFF7E5" letter-spacing="1.3">AVAILABLE FOR SELECT WORK</text>
  </g>
</svg>
